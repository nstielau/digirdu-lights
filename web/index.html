<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Digirdu Lights</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><a class="brand" href="/">DIGIRDU LIGHTS</a><div id="account-control"></div><nav aria-label="Main"><a href="/" aria-current="page">Fleet</a><a href="/effects.html">Effects</a></nav></header>
<div class="page-heading"><div class="hero-copy"><p class="eyebrow">SOUND INTO LIGHT / FLEET CONTROL</p><h1>Your lighting fleet</h1><p>Releases, device reports, and updates.</p><span class="hero-tag">DIGIRDU / WIRELESS LIGHT SYSTEM</span></div></div>
<main><div class="toolbar"><p id="account">Sign in to manage your devices.</p><button id="refresh" hidden>Refresh reports</button></div><p id="status" role="status" aria-live="polite"></p>
<section id="fleet" hidden><div class="section-head"><h2>Devices</h2><p id="stable"></p></div><p class="hint">Reports arrive at startup. Last seen does not mean currently online.</p><div id="devices" class="cards"></div><h2>Releases</h2><div id="releases"></div></section></main>
<template id="device-card"><article class="card"><div class="card-head"><h3></h3><span class="badge"></span></div><p class="identity"></p><dl></dl><div class="actions"><select aria-label="Release"></select><button data-action="pin">Assign release</button><button data-action="latest">Follow latest</button><button data-action="pause">Pause updates</button><button data-action="resume">Resume updates</button><button data-action="rename">Rename</button><button data-action="disable" class="danger">Revoke device</button></div></article></template>
<script type="module" src="./app.js"></script></body></html>
